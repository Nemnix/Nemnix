    <main>

        <h2>Diagnosticos</h2>

        <dialog id="VizualizacionDiagnostico" class="Formulario">
            <form id="formularioDiagnostico" action="#" method="post">
                <fieldset>
                    <legend>Diagnostico</legend>

                    <ul>
                        <input type="hidden" id="IDDiagnostico" name="ID_D">
                        <li>

                            <label for="IDestadoDiagnostico">Estado</label>

                            <select id="IDestadoDiagnostico" name="estadoDiagnostico">
                                <option>En proceso</option>
                                <option>Solucionado</option>
                                <option>Requiere otro factor</option>
                                <option>Requiere autorización</option>
                            </select>

                        </li>

                        <li>
                            <label for="IDTicketAsociado">
                                Ticket Asociado
                            </label>

                            <input type="number" id="IDTicketAsociado" name="IDTicketAsociado" readonly>
                        </li>

                        <li>
                            <label for="IDfechaDiagnostico">Fecha</label>

                            <input type="date" id="IDfechaDiagnostico" name="IDfechaDiagnostico">
                        </li>

                        <li>
                            <label for="IDdescripcionDiagnostico">
                                Descripcion
                            </label>

                            <input type="text" id="IDdescripcionDiagnostico" name="IDdescripcionDiagnostico" required
                                placeholder="Escriba una descripción del diagnostico o tematicas realizadas">
                        </li>

                        <li>
                            <button type="submit" id="GuardarCambios">
                                Guardar cambios
                            </button>
                        </li>

                        <li>
                            <button type="button" id="CerrarDiagnostico">
                                Cerrar
                            </button>
                        </li>
                    </ul>
                </fieldset>
            </form>
        </dialog>

        <ul>
            <li>
                <div class="opciones">
                    <label for="idDiagnosticoEstado">Estado</label>

                    <select id="idDiagnosticoEstado" name="EstadoDiagnostico">
                        <option>Todos</option>
                        <option>Solucionado</option>
                        <option>En proceso</option>
                        <option>Requiere autorización</option>
                        <option>Requiere otro factor</option>
                    </select>
                </div>
            </li>
            <li>
                <div class="opciones">
                    <label for="IDtiempoDiagnostico">Tiempo</label>
                    <select id="IDtiempoDiagnostico" name="TiempoDiagnostico">
                        <option>Más recientes</option>
                        <option>Más antiguos</option>
                    </select>
                </div>
            </li>
        </ul>

        <section class="Tablas">
            <fieldset>
                <table id="estadoTickets">
                    <thead>
                        <tr>
                            <th>Ticket</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Diagnostico</th>
                            <th>Acciones</th>
                            
                        </tr>
                    </thead>

                    <tbody>



                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>

                            <td>
                                <div class="cajaOperaciones">
                                    <button type="button" class="btnOperacion btnAbrirDiagnostico"
                                        data-diagnostico="">Abrir</button>
                                <form action="#" method="post" class="formularioBajaDiagnostico">
                                    <input type="hidden" name="ID_D" value="">
                                    <button type="submit" class="btnEliminar">Eliminar</button>
                                </form>
                                </div>
                            </td>
                        </tr>


                    </tbody>
                </table>
            </fieldset>
        </section>

    </main>
