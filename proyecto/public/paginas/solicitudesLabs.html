    <main>
        <h2>Solicitudes</h2>
        <button id="btnSolicitudes" class="botonesAgregar">Agregar solicitud</button>
<dialog id="SolicitudesL" class="Formulario">
    <form id="FormularioSolicitudes" action="#" method="POST">
        <fieldset>
            <legend>Solicitud de preparación de laboratorios</legend>
            <input type="hidden" id="idSolicitud" name="ID_L">
            <input type="hidden" id="fechaActual" name="fechaActual">
            <input type="hidden" id="horaActual" name="horaActual">
            <ul>
                <li>
                    <label for="IDLaboratorio">Seleccione el número del laboratorio o taller</label>
                    <select id="IDLaboratorio" name="nombreLaboratorio">
                        <option>Laboratorio</option>
                        <option>Taller</option>
                    </select>
                </li>
                <li>
                    <label for="numLabTaller">Escriba el número del laboratorio o taller</label>
                    <input type="text" id="numLabTaller" name="numLaboratorio"  pattern="[0-9]{1,3}" maxlength="3"
                        required placeholder="Número laboratorio/taller" />
                </li>
                <li>
                    <label for="fechaLaboratorio">Fecha aproximada de cuando necesita esta preparación</label>
                    <input type="date" id="fechaLaboratorio" name="fecha">
                </li>
                <li>
                    <label for="horaLaboratorio">Hora en la que necesita esta preparación</label>
                    <input type="time" id="horaLaboratorio" name="hora" required>
                </li>
                <li>
                    <label for="motivoSolicitudes">Descripción</label>
                    <input type="text" id="motivoSolicitudes" name="descripcionSolicitud" required
                        placeholder="Describa lo que precisa" />
                </li>
                <li>
                    <label for="mailDocente">Mail</label>
                    <input type="email" id="mailDocente" name="gmail" required
                        placeholder="Escriba su mail" />
                </li>
                <li>
                    <button type="submit"> Enviar </button>
                    <button type="button" id="btnCerrarSolicitud"> Cerrar </button>
                </li>
            </ul>
        </fieldset>
    </form>
</dialog>

        <section class="Tablas">
            <fieldset>
                <table id="registroSolicitudes">
                    <thead>
                    <tr>
                        <th>Tipo de laboratorio</th>
                        <th>Número de laboratorio</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Descripción</th>
                        <th>Mail</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="tablaOpciones">
                    </tbody>
