    <main>
        <h2>Inventario</h2>
        <button id="btnAgregarLaboratorio" class="botonesAgregar">Registrar nuevo laboratorio</button>

        <dialog id="AgregarLaboratorio" class="Formulario">

            <form id="FormularioAgregarLaboratorio">
                <fieldset>
                    <legend>Registrar nuevo laboratorio</legend>
                    <ul>
                        <li>
                            <label for="registroLaboratorio">Seleccione el tipo de aula</label>
                            <select id="registroLaboratorio" name="registroLaboratorio" required>
                                <option>Laboratorio</option>
                                <option>Taller</option>
                            </select>
                        </li>
                        <li>
                            <label for="registroNumLabTaller">Numero del laboratorio o taller</label>
                            <input type="text" id="registroNumLabTaller" name="registroNumLabTaller" pattern="[0-9]{2}"
                                maxlength="2" required required placeholder="Escriba el numero laboratorio/taller" />
                        </li>
                        <li>
                            <label for="cantMonitores">Cantidad monitores</label>
                            <input type="number" id="cantMonitores" name="cantMonitores" required
                                placeholder="Escriba la cantidad de monitores que hay">
                        </li>
                        <li>
                            <label for="cantTeclados">Cantidad teclados</label>
                            <input type="number" id="cantTeclados" name="cantTeclados" required
                                placeholder="Escriba la cantidad de teclados que hay">
                        </li>
                        <li>
                            <label for="cantMouses">Cantidad mouses</label>
                            <input type="number" id="cantMouses" name="cantMouses" required
                                placeholder="Escriba la cantidad de mouses que hay">
                        </li>
                        <li>
                            <label for="cantComputadoras">Cantidad computadoras</label>
                            <input type="number" id="cantComputadoras" name="cantComputadoras" required
                                placeholder="Escriba la cantidad de computadoras que hay">
                        </li>
                        <li>
                            <button type="submit" id="btnAgregarLaboratorio"> Enviar </button>
                            <button type="button" id="btnCerrarRegistroLaboratorio"> Cerrar </button>
                        </li>
                        <li>

                        </li>
                    </ul>
                </fieldset>
            </form>
        </dialog>

        <section class="Tablas">
            <fieldset>
                <table id="Inventario">
                    <thead>
                    <tr>
                        <th>Id</th>
                        <th>Tipo de aula</th>
                        <th>Numero de aula</th>
                        <th>Monitores</th>
                        <th>Teclados</th>
                        <th>Ratones</th>
                        <th>Computadoras</th>
                        <th>Acciones</th>

                    </tr>
                    </thead>
                    <tbody>
                    <tr>

                    </tr>
                    </tbody>
                </table>
            </fieldset>
        </section>
