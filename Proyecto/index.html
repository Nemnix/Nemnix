<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesion</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <section class="formulario">
        <form id="formularioLogin">
            <fieldset>
                <legend>Ingreso</legend>
                <ul>
                    <li>
                        <label for="CI">Cedula de identidad</label>
                        <input type="text" id="CI" name="CI_empleado" pattern="[1-9]+" title="Sin puntos ni guiones" maxlength="8"
                            required placeholder="Escribe tu cedula aqui" />
                    </li>
                    <li>
                        <label for="Contraseña">Contraseña</label>
                        <input type="password" id="Contraseña" name="Contraseña_empleado" required
                            placeholder="Ingrese su contraseña aqui" />
                    </li>
                    <li>
                        <button type="submit">Ingresar </button>
                    </li>
                </ul>
            </fieldset>
        </form>
    </section>

    <!--Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="Assets/JavaScript/login.js"></script>
</body>
</html>
