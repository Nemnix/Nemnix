<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario prestamos</title>
    <link rel="stylesheet" href="../Assets/css/global.css">
</head>
<body>
    <header>
        <img class="logo" src="Logo" alt="Logo">
        <button id="btnMenu" aria-label="Toggle menu">&#9776;</button>
        <button id="btnCerrar" aria-label="Toggle menu"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='currentColor'><path d='M.293.293a1 1 0 011.414 0L8 6.586 14.293.293a1 1 0 111.414 1.414L9.414 8l6.293 6.293a1 1 0 01-1.414 1.414L8 9.414l-6.293 6.293a1 1 0 01-1.414-1.414L6.586 8 .293 1.707a1 1 0 010-1.414z'/></svg></button>
        <nav>
            <ul class="MenuPrincipal">
                <li><a href="paginaBienvenidaTecnico.html" class="BotonNavegacion">Inicio</a></li>
                <li><a href="listaTicketsEntrantes.html" class="BotonNavegacion">Tickets entrantes</a></li>
                <li><a href="listaDiagnosticos.html" class="BotonNavegacion">Diagnosticos</a></li>
                <li><a href="prestamosEquipos.html" class="BotonNavegacion">Prestamo equipos</a></li>
                <li><a href="inventarioPrestamos.html" class="BotonNavegacion">Inventario prestamo</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>inventario prestamos</h2>
        <button id="btnAgregarEquipo">Agregar nuevo equipo</button>
        <dialog id="RegistroEquipoP" class="Formulario">
        <form id="FormularioInventarioEquipos">
                <fieldset>
                    <legend>Equipo de prestamo</legend>
                    <ul>
                        <li>
                            <label for="IDequipo">IDequipo</label>
                            <input type="text" id="IDequipo" name="ID_equipo"
                                required placeholder="Escribe la ID del equipo" />
                        </li>
                        <li>
                            <label for="modeloPrestamo">Modelo</label>
                            <input type="text" id="modeloPrestamo" name="modelo_prestamo" required placeholder="Ingrese el modelo del equipo">
                        </li>
                        <li>
                            <label for="estadoEquipos">Seleccione estado</label>
                            <select id="estadoEquipos" name="estadoEquipos">
                            <option>Disponible</option>
                            <option>Prestamo en fecha</option>
                            <option>VENCIDO</option>
                            </select>
                        </li>
                        <li>
                            <label for="nombreAlumnoPrestamo">Nombre</label>
                            <input type="text" id="nombreAlumnoPrestamo" name="nombreAlumnoPrestamo"  placeholder="Ingrese el nombre del alumno">
                        </li>
                        <li>
                            <label for="apellidoAlumnoPrestamo">Apellido</label>
                            <input type="text" id="apellidoAlumnoPrestamo" name="apellidoAlumnoPrestamo"  placeholder="Ingrese el apellido del alumno">
                        </li>
                        <li>
                            <label for="CI">Cedula de identidad</label>
                            <input type="text" id="CI" name="CI_empleado" pattern="[1-9]+" title="Sin puntos ni guiones" placeholder="Escribe tu cedula aqui" />
                        </li>
                        <li>
                            <label for="fechaPrestamo">Fecha</label>
                            <input type="date" id="fechaPrestamo" name="fechaPrestamo">
                        </li>
                        <li>
                            <label for="fechaDevolucion">Fecha de devolucion</label>
                            <input type="date" id="fechaDevolucion" name="fechaDevolucion">
                        </li>
                        <li>
                            <button type="submit" id="btnGuardarInventario"> Enviar </button>
                            <button type="button" id="btnCerrarInventario">Cerrar</button>
                        </li>
                    </ul>
                </fieldset>
            </form>
        </dialog>

        <fieldset>
        <table id="tablaInventarioPRestamo">
            <thead>
                <tr>
                    <th>IDequipo</th>
                    <th>Modelo</th>
                    <th>Estado</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="registroInventarioPRestamo">
            <tr>

            </tr>
            </tbody>
        </table>
        </fieldset>
    </main>
    <footer>
    <span>¿Problemas con la pagina? Escribenos a: nemnix1@gmail.com</span>
    </footer>
    <script src="../Assets/JavaScript/listaPrestamos.js"></script>
</body>
</html>
