<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnosticos</title>
</head>
<body>
    <header>
        <h2>Logo</h2>
        <img src="Logo" alt="Logo">
        <nav>
            <ul class="MenuPrincipal">
                <li><a href="paginaBienvenidaTecnico.html" class="BotonNavegacion">Inicio</a></li>
                <li><a href="listaTicketsEntrantes.html" class="BotonNavegacion">Tickets entrantes</a></li>
                <li><a href="listaDiagnosticos.html" class="BotonNavegacion">Diagnosticos</a></li>
                <li><a href="prestamosEquipos.html" class="BotonNavegacion">Prestamo equipos</a></li>
                <li><a href="inventarioPrestamos.html" class="BotonNavegacion">Inventario prestamo</a></li>
                
            </ul>
        </nav>
    </header>
    <main>
        <h2>Diagnosticos</h2>
        <dialog id="VizualizacionDiagnostico" class="FormularioVizualizacionDiagnostico">
                <form id="VizualizacionDiagnostico"> 
                <fieldset>
                    <legend>Diagnostico</legend>
                    <ul>
                        <li>
                            <label for="IDestadoDiagnostico">Estado </label>
                            <select id="IDestadoDiagnostico" name="estadoDiagnostico">
                                <option>En proceso</option>
                                <option>Solucionado</option>
                                <option>Requiere otro factor</option>
                                <option>Requiere autorización</option>

                            </select>
                        </li>
                        <li>
                            <label for="IDTicketAsociado">Ticket Asociado</label>
                            <input type="number" id="IDTicketAsociado" name="IDTicketAsociado">
                        </li>
                        <li>
                            <label for="IDfechaDiagnostico">Fecha</label>
                            <input type="date" id="IDfechaDiagnostico" name="IDfechaDiagnostico">
                        </li>
                        <li>
                            <label for="IDdescripcionDiagnostico">Descripcion</label>
                            <input type="text" id="IDdescripcionDiagnostico" name="IDdescripcionDiagnostico" required
                            placeholder="Escriba una descripción del diagnostico o tematicas realizadas" />
                        </li>
                        <li>
                            <button type="submit"> Guardar cambios </button>
                        </li>
                        <li>
                            <button id="CerrarDiagnostico">Cerrar</button>
                        </li>
                    </ul>    
                </fieldset>
            </form>    
            </section>
            </dialog>

        
        <label for="IDestadoDiagnostico">Estado</label>
        <select id="IDestadoDiagnostico" name="EstadoDiagnostico">
            <option>Solucionado</option>
            <option>En proceso</option>
            <option>Requiere autorizacion</option>
            <option>Requiere otro factor</option>

        </select>

        <label for="IDtiempoDiagnostico">Tiempo</label>
        <select id="IDtiempoDiagnostico" name="TiempoDiagnostico">
            <option>Mas recientes</option>
            <option>Mas antiguos</option>

        </select>

        <fieldset>
            <table id="estadoTickets">

                <tr>
                    <th>Diagnostico</th>
                    <th>Estado</th>
                    <th>Ticket</th>
                    <th>Acciones</th>
                </tr>

                <tr>

                </tr>

            </table>
        </fieldset>
    </main>
    <footer>
    <span>¿Problemas con la pagina? Escribenos a: nemnix1@gmail.com</span>
    </footer>
</body>
</html>
