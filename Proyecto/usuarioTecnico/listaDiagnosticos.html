<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnosticos</title>
    <link rel="stylesheet" href="../Assets/css/global.css">
</head>

<body>

    <header>
        <img class="logo" src="Logo" alt="Logo">
        <button id="btnMenu" aria-label="Toggle menu">&#9776;</button>
        <button id="btnCerrar" aria-label="Toggle menu"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='currentColor'><path d='M.293.293a1 1 0 011.414 0L8 6.586 14.293.293a1 1 0 111.414 1.414L9.414 8l6.293 6.293a1 1 0 01-1.414 1.414L8 9.414l-6.293 6.293a1 1 0 01-1.414-1.414L6.586 8 .293 1.707a1 1 0 010-1.414z'/></svg></button>
        <nav>
            <ul class="MenuPrincipal">
                <li>
                    <a href="paginaBienvenidaTecnico.html" class="BotonNavegacion">
                        Inicio
                    </a>
                </li>
                <li>
                    <a href="listaTicketsEntrantes.html" class="BotonNavegacion">
                        Tickets entrantes
                    </a>
                </li>
                <li>
                    <a href="listaDiagnosticos.html" class="BotonNavegacion">
                        Diagnosticos
                    </a>
                </li>
                <li>
                    <a href="inventarioPrestamos.html" class="BotonNavegacion">
                        Prestamo equipos
                    </a>
                </li>
            </ul>
        </nav>
        <script src="../Assets/JavaScript/menu.js"></script>
    </header>

    <main>

        <h2>Diagnosticos</h2>

        <dialog id="VizualizacionDiagnostico" class="Formulario">
            <form id="formularioDiagnostico">
                <fieldset>
                    <legend>Diagnostico</legend>

                    <ul>
                        <li>
                            <label for="IDestadoDiagnostico">Estado</label>

                            <select id="IDestadoDiagnostico" name="estadoDiagnostico">
                                <option>En proceso</option>
                                <option>Solucionado</option>
                                <option>Requiere otro factor</option>
                                <option>Requiere autorizacion</option>
                            </select>
                        </li>

                        <li>
                            <label for="IDTicketAsociado">
                                Ticket Asociado
                            </label>

                            <input
                                type="number"
                                id="IDTicketAsociado"
                                name="IDTicketAsociado"
                            >
                        </li>

                        <li>
                            <label for="IDfechaDiagnostico">Fecha</label>

                            <input
                                type="date"
                                id="IDfechaDiagnostico"
                                name="IDfechaDiagnostico"
                            >
                        </li>

                        <li>
                            <label for="IDdescripcionDiagnostico">
                                Descripcion
                            </label>

                            <input
                                type="text"
                                id="IDdescripcionDiagnostico"
                                name="IDdescripcionDiagnostico"
                                required
                                placeholder="Escriba una descripción del diagnostico o tematicas realizadas"
                            >
                        </li>

                        <li>
                            <button type="submit" id="GuardarCambios">
                                Guardar cambios
                            </button>
                        </li>

                        <li>
                            <button id="CerrarDiagnostico">
                                Cerrar
                            </button>
                        </li>
                    </ul>
                </fieldset>
            </form>
        </dialog>

        <label for="idDiagnosticoEstado">Estado</label>

        <select id="idDiagnosticoEstado" name="EstadoDiagnostico">
            <option>Todos</option>
            <option>Solucionado</option>
            <option>En proceso</option>
            <option>Requiere autorizacion</option>
            <option>Requiere otro factor</option>
        </select>

        <label for="IDtiempoDiagnostico">Tiempo</label>

        <select id="IDtiempoDiagnostico" name="TiempoDiagnostico">
            <option>Mas recientes</option>
            <option>Mas antiguos</option>
        </select>

        <fieldset>
            <table id="estadoTickets">
                <thead>
                    <tr>
                        <th>Diagnostico</th>
                        <th>Estado</th>
                        <th>Ticket</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                    </tr>
                </tbody>
            </table>
        </fieldset>

    </main>

    <footer>
        <span>
            ¿Problemas con la pagina? Escribenos a: nemnix1@gmail.com
        </span>
    </footer>

    <script src="../Assets/JavaScript/listaDiagnosticos.js"></script>

</body>

</html>
