<body>

            <th>Nombres</th>
            <th>Apellido</th>
            <th>Cargo</th>

        </tr>
        <tr>
            <td>12345678</td>
            <td>Juan</td>
            <td>Magallanes</td>
            <td>Administrador</td>

            <td>
                <button onclick="modificar(this)">Modificar</button>

                <br>
                <button onclick="borrar(this)">Eliminar</button>
            </td>
        </tr>

    </table>
    </fieldset>
</body>

</html>
