<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administradores</title>
    <link rel="stylesheet" href="css/registroDiario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <h1>Panel de administradores</h1>


    <button id="btnPanelAdministradores">Agregar usuario</button>

    <fieldset>
        
    <table id="panelAdministradores">

        <tr>
            <th>CI</th>
            <th>Nombres</th>
            <th>Apellido</th>
            <th>Cargo</th>
            <th>Acciones</th>
        </tr>
        <tr>
            <td>12345678</td>
            <td>Juan</td>
            <td>Magallanes</td>
            <td>Administrador</td>

            <td>
                <button onclick="modificar(this)">Modificar</button>
                <br>
                <br>
                <button onclick="borrar(this)">Eliminar</button>
            </td>
        </tr>

    </table>
    </fieldset>
    <!--Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
