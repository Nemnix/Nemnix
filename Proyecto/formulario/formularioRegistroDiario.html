<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css\formulario.css">
</head>
<body>
            <form action="registroDiario.html" class="formulario">
                <fieldset>
                    <legend>Solicitud de preparación de laboratorios</legend>
                    <ul>
                        <li>
                            <label for="IDLaboratorio">Seleccione el numero del laboratorio o taller en el cual se encuentra </label>
<select id="IDLaboratorio" name="preparacionLaboratorio">
    <option>Laboratorio 1</option>
    <option>Laboratorio 2</option>
    <option>Laboratorio 3</option>
    <option>Laboratorio 4</option>
    <option>Laboratorio 5</option>
    <option>Laboratorio 6</option>
    <option>Taller 1</option>
    <option>Taller 2</option>
    <option>Taller 3</option>

</select>
                        </li>
                        <li>
                            <label for="fechaLaboratorio">Fecha</label>
                            <input type="date" id="fechaRegistroDiario" name="fechaRegistroDiario" required>

                        </li>
                        <li>
                            <label for="asignatura">Asignatura</label>
                            <input type="text" id="asignaturaRegistroDiario" required
                                placeholder="Escriba su asignatura"/>
                        </li>
                        <li>
                            <label for="horaEntrada">Hora de Entrada</label>
                            <input type="time" id="horaEntrada" required>
                        </li>
                        <li>
                            <label for="horaSalida">Hora de salida</label>
                            <input type="time" id="horaSalida" required>
                        </li>
                        <li>
                            <label for="grupoRegistroDiario">Grupo</label>
                            <input type="text" id="grupoRegistroDiario" 
                            placeholder="Ingrese nombre del grupo aqui" required>
                        </li>
                        <li>
                            <label for="turnoRegistroDiario">Turno</label>
                            <select id="turnoRegistroDiario" required>
                                <option value="Matutino">Matutino</option>
                                <option value="Vespertino">Vespertino</option>
                                <option value="Nocturno">Nocturno</option>
                            </select>
                        </li>
                        
                        <li>
                            <button type="submit"> Enviar </button>
                        </li>
                        <li>
                            
                        </li>
                    </ul>    
                </fieldset>
            </form>    
</body>
</html>
