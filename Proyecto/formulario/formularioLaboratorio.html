<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css\formulario.css">
</head>
<body>
            <form action="laboratorioExitoso.html" class="formulario">
                <fieldset>
                    <legend>Solicitud de preparación de laboratorios</legend>
                    <ul>
                        <li>
                            <label for="IDLaboratorio">Seleccione el número del laboratorio o taller el cual necesita una instalación de software o configuración de equipos </label>
<select id="IDLaboratorio" name="preparacionLaboratorio">
    <option>Laboratorio 1</option>
    <option>Laboratorio 2</option>
    <option>Laboratorio 3</option>
    <option>Laboratorio 4</option>
    <option>Laboratorio 5</option>
    <option>Laboratorio 6</option>
    <option>Taller 1</option>
    <option>Taller 2</option>
    <option>Taller 3</option>
                        </li>
</select>
                        <li>
                            <label for="fechaLaboratorio">Fecha aproximda de cuando necesita esta preparación</label>
                            <input type="date" id="fechaLaboratorio" name="fechaLaboratorio">

                        </li>
                        <li>
                            <label for="Descripcion">Descripcion</label>
                            <input type="text" id="motivoTicket" required
                                placeholder="Describa lo que precisa" />
                        </li>
                         <li>
                            <label for="mailDocente">Mail</label>
                            <input type="email" id="mailDocente" name="mailDocente" required
                                placeholder="Escriba su mail" />
                        </li>
                        <li>
                            <button type="submit"> Enviar </button>
                        </li>
                    </ul>    
                </fieldset>
            </form>    
</body>
</html>
