<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css\formulario.css">
</head>
<body>
            <form action="prestamoExitoso.html" class="formulario">
                <fieldset>
                    <legend>Prestamo de equipo</legend>
                    <ul>
                        <li>
                            <label for="CI">Cedula de identidad</label>
                            <input type="text" id="CI" name="CI_empleado" pattern="[1-9]+" title="Sin puntos ni guiones" maxlength="8"
                                required placeholder="Escribe tu cedula aqui" />
                        </li>
                        <li>
                            <label for="nombreAlumnoPrestamo">Nombre completo del alumno</label>
                            <input type="text" id="nombreAlumnoPrestamo" required placeholder="Ingrese el nombre del alumno">
                        </li>
                        <li>
                            <label for="fechaPrestamo">Fecha</label>
                            <input type="date" id="fechaPrestamo" name="fechaPrestamo">

                        </li>
                        <li>
                            <label for="fechaDevolucion">Fecha de devolucion</label>
                            <input type="text" id="fechaDevolucionPrestamo" required
                                placeholder="Apartir de la fecha seleccionada se calcular una fecha limite" />
                        </li>
                        <li>
                            <button type="submit"> Enviar </button>
                        </li>
                    </ul>    
                </fieldset>
            </form>    
</body>
</html>
