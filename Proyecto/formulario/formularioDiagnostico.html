<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css\formulario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <section class="formulario">
            <form action="diagnosticoExitoso.html" class="formulario">
                <fieldset>
                    <legend>Diagnostico</legend>
                    <ul>
                        <li>
                            <label for="estado">Estado </label>
    <select id="estadoDiagnostico" name="estado">
        <option>En proceso</option>
        <option>Solucionado</option>
        <option>Requiere otro factor</option>
        <option>Requiere autorización</option>

    </select>
                        </li>
                        <li>
                            <label for="fechaLaboratorio">Fecha</label>
                            <input type="date" id="fechaDiagnostico" name="fechaDiagnostico">

                        </li>
                        <li>
                            <label for="Descripcion">Descripcion</label>
                            <input type="text" id="descripcionDiagnostico" required
                            placeholder="Escriba una descripción del diagnostico o tematicas realizadas" />
                        </li>
                        <li>
                            <button type="submit"> Enviar </button>
                        </li>
                    </ul>    
                </fieldset>
            </form>    
    </section>
    <!--Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
